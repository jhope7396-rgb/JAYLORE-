<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAYLORE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      padding: 25px 20px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-top: 35px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-top: 8px;
      font-size: 14px;
    }

    .card {
      margin-top: 40px;
      padding: 25px;
      background: #1d1d1d;
      border-radius: 20px;
      text-align: center;
    }

    .music-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      line-height: 1.6;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">JAYLORE</div>

    <div class="subtitle">
      Jay J & Melody
    </div>

    <div class="card">

      <div class="music-icon">🎵</div>

      <h2>Welcome to JAYLORE</h2>

      <p>
        Our music journey starts here.
        Create, record and share music with Melody.
      </p>

      <a class="button" href="#">
        🎧 Enter JAYLORE
      </a>

    </div>

    <div class="footer">
      © 2026 JAYLORE — Jay J & Melody
    </div>

  </div>

</body>
</html>
